[custom]
; ==========================================================
; 方案 C：地区组改 fallback（专线优先、挂了才切），账号类应用默认用地区稳定组，
;        其余默认自动选择；AI 仅允许自建 VPS、新加坡、日本和美国，不降级到其他地区或直连。
; 多订阅：OpenClash 订阅转换里一行一个地址，会合并成一个配置；
;        同地区同线路的节点按订阅顺序排列 → 最稳定的机场放第一行。
; 不要再用 load-balance：同一网站多出口 IP 会触发风控，池内节点挂掉会导致整批站点断连。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
; 注意：不要加“节点”这类词，很多机场节点名本身就叫“香港节点01”，会被整批剔除
; 注意：外部配置里只认 exclude_remarks / include_remarks；写成 exclude= 会被 subconverter 静默忽略
exclude_remarks=(?i)流量|套餐|到期|过期|有效期|剩余|重置|官网|网站|网址|失联|公告|通知|TG群|TG频道|Telegram群|Telegram频道|电报群|电报频道|说明|QQ群|客服|工单|订阅|域名|无法|客户端|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
;    GEOSITE/GEOIP 标签依赖当前内核和 geo 数据；如生成失败，优先检查对应标签是否存在。
; ==========================================================
; --- 严格 AI：已识别的 AI 域名优先于通用端口、国内 IP 和其他直连规则 ---
; 当前共 56 条 ruleset；后端默认上限 64，核验工具负责检查。
ruleset=🧠 AI,[]DOMAIN,gemini.google.com
ruleset=🧠 AI,[]DOMAIN,aistudio.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
; 上游已收录 ai.google.dev；保留此条作为显式入口保障。
ruleset=🧠 AI,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🧠 AI,[]DOMAIN,sydney.bing.com
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Tailscale 直连 ---
; 域名（MagicDNS / tailnet 内部访问）走这里；CGNAT 100.64.0.0/10 和 ULA fd7a:115c:a1e0::/48
; 已被上面的 GEOIP,private 完整覆盖（永不被匹配的死规则，已删），不再单列
ruleset=DIRECT,[]DOMAIN-SUFFIX,tailscale.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,ts.net

; --- Tailscale DERP / NAT 穿透专用旁路 ---
; 背景：Tailscale 守护进程用内置 DNS 解析器直接查 derpN.tailscale.com（不走系统 DNS），
; 到达 clash 时已是裸 IP，DOMAIN-SUFFIX 规则不命中。Tailscale 又对 NAT 端口映射极度敏感，
; 一旦 UDP 走代理就会(a)永远无法 P2P 直连；(b)DERP netcheck 测量全被代理延迟拉平，
; 误选远端 DERP；(c)VNC/SSH 必走 DERP 中继，jitter 巨大。
; 下面 7 条按"端口 → IP 段"双保险，覆盖 netcheck/STUN/WireGuard/DERP HTTPS。
; DERP/STUN 探测（netcheck）
ruleset=DIRECT,[]DST-PORT,3478
; Tailscale WireGuard 默认端口（对端入站）
ruleset=DIRECT,[]DST-PORT,41641
; Tailscale WireGuard 默认端口（本地出站）
ruleset=DIRECT,[]SRC-PORT,41641
; HE 段：含 derp10/HKG（香港）
ruleset=DIRECT,[]IP-CIDR,192.73.240.0/24,no-resolve
; Tailscale 自有段（多区 DERP）
ruleset=DIRECT,[]IP-CIDR,205.147.104.0/22,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,208.83.234.0/24,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,199.38.181.0/24,no-resolve
; --- 自建 DERP 节点（广州阿里云）直连 ---
ruleset=DIRECT,[]DOMAIN-SUFFIX,wccczy.online
ruleset=DIRECT,[]IP-CIDR,8.148.145.218/32,no-resolve
; 备注：DERP 节点 IP 偶尔会扩，权威列表见 https://login.tailscale.com/derpmap/default
; 如发现新 IP 段被代理（tailscale ping 仍走错 DERP），把该段补到上面 IP-CIDR 列表。

; --- 广告拦截 ---
; 放在国内直连之前，国内 App 的广告/统计域名也会被拦。个别 App 或网页异常时，把「🛑 广告拦截」切到 DIRECT 排查。
; 必须放在私网/Tailscale 之后，避免误伤这几类。
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=📥 游戏下载,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 核心应用 ---
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve

ruleset=🍎 Apple,[]GEOSITE,apple
; fast.com 测 Netflix 链路：页面与 Netflix 测试服务器保持同一策略。
; 其他测速工具仍可独立选择 DIRECT；页面直连不代表整个测试流量直连。
ruleset=🎥 Netflix,[]DOMAIN,fast.com
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

; --- 海外主流应用补充 ---
; 注：MetaCubeX GeoIP 没有 adobe/tiktok/github/microsoft/spotify 标签，写了也匹配不到（geodata 模式下还可能报错），故只用 GEOSITE
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎧 Spotify,[]GEOSITE,spotify
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter
ruleset=🐦 X,[]GEOIP,twitter,no-resolve

; --- 开发 / 工具 ---
; Steam 社区/商店/登录 API 被墙但在 GEOSITE,steam 里，若不前置会落进默认 DIRECT 的
; 🎮 Steam 组 = 实际打不开；下载 CDN（steamcontent.com 等）不在 gfw 里，仍走 DIRECT
ruleset=🚀 代理兜底,[]DOMAIN-SUFFIX,steamcommunity.com
ruleset=🚀 代理兜底,[]DOMAIN-SUFFIX,api.steampowered.com
ruleset=🚀 代理兜底,[]DOMAIN-SUFFIX,store.steampowered.com
ruleset=🚀 代理兜底,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
; Meta 系（Facebook/Instagram/WhatsApp）共用 IP 段，裸 IP 连接归社交媒体
ruleset=💬 社交媒体,[]GEOIP,facebook,no-resolve

; --- Cloudflare ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
; Cloudflare IP 作为 CDN 基础设施容易覆盖无关网站，默认不启用。
; ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve

; --- ✈️ Cathay → GitHub → Google → Microsoft（按序排列） ---
; Cathay 关键字规则必须位于 MATCH 之前，否则永不生效
ruleset=✈️ Cathay Pacific,[]DOMAIN-KEYWORD,cathaypacific
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- GFW 兜底 ---
ruleset=🚀 代理兜底,[]GEOSITE,gfw

; --- 最终兜底（必须是最后一条，之后的规则永不生效）---
ruleset=🐟 漏网之鱼,[]MATCH


; ==========================================================
; 2) 应用分流策略组
;    默认值 = 列表第一项，其余全部可在面板手动切换
;    · 在乎出口 IP（账号风控）：默认用地区「稳定组」(fallback)，节点挂了才切，IP 不随延迟抖动乱跳
;    · 不在乎出口 IP：默认 ♻️ 自动选择（url-test，大容差）
;    · 直连优先的（测速/Steam/Microsoft）保持 DIRECT 在首位
; ==========================================================

; --- 在乎 IP：AI ---
; 严格出口：仅 🔐 AI 稳定 的批准出口链，或 REJECT。
; 出口链限定 VPS / SG / JP / US；不引用全节点手动、冷门或 Default，全部失败不直连。
custom_proxy_group=🤖 ChatGPT`select`[]🔐 AI 稳定`[]REJECT
custom_proxy_group=🧠 AI`select`[]🔐 AI 稳定`[]REJECT

; --- 在乎 IP：账号类 ---
custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
; TikTok 已退出香港，HK 节点无法使用，默认 JP
custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]🇭🇰 HK`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; --- 不在乎 IP：默认自动选择 ---
custom_proxy_group=📨 Telegram`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=📞 即时通讯`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=💬 社交媒体`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
; Netflix 解锁看具体节点（订阅里标了 NF/奈飞 的），自动选择不保证解锁，看片时手动选
custom_proxy_group=🎥 Netflix`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
; Spotify 曲库跟出口区域走，想锁区时手动选固定节点
custom_proxy_group=🎧 Spotify`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=☁️ cloudflare`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=✈️ Cathay Pacific`select`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT`[]🌐 Default
; Adobe 已整体移除（不使用 Adobe 产品；GEOSITE,adobe 里的 typekit/demdex 等第三方域名落到 gfw/漏网之鱼走代理，无副作用）

; --- 直连优先 ---
custom_proxy_group=📥 游戏下载`select`[]DIRECT`[]♻️ 自动选择`[]🧭 手动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门自动`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
; 广告拦截：默认 REJECT；遇到误杀切 DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; ==========================================================
; 3) 兜底出口
; ==========================================================
; GFW 列表：不在乎 IP，默认自动选择
custom_proxy_group=🚀 代理兜底`select`[]♻️ 自动选择`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
; 漏网之鱼：默认自动选择；想要固定出口时切 🌐 Default
custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动选择`[]🌐 Default`[]DIRECT`[]🧊 冷门节点`[]🧭 手动选择`[]🚀 代理兜底

; ==========================================================
; 4) 自动兜底链（fallback：按顺序用第一个可用的，前面的恢复后自动切回）
;    fallback 组在面板里也能手动点选某一项，手动选中后只要它可用就一直用它
; ==========================================================
; 测速参数（全模板统一）：间隔 600s、url-test 容差 300ms。
;   ⚠️ 格式是 `test_url`interval[,timeout][,tolerance]，但 subconverter 只写 interval/tolerance，
;      timeout 值（上面那些 ,10）不会进配置，实际超时由内核默认值决定——别指望它生效。
;   ⚠️ 这些值只有在 OpenClash「覆写设置」的 urltest_address_mod / urltest_interval_mod / tolerance
;      全为 0 时才有效，否则会被 yml_rules_change.sh 整份抹平（踩过一次，见 README）。
;   放宽判据是为了少误杀：晚高峰一次 6s 的 TLS 往返不代表节点不能用。
;   探针保持 HTTPS（明文 204 可能被透明网关伪答），但目标默认换成
;   https://cp.cloudflare.com/generate_204 —— Cloudflare anycast 不按出口 IP 段限流；
;   gstatic 会被 Google 按 IP 信誉返回 429/超时，共享出口的机场节点容易整批被误判 Down
;   → 整个地区组消失 → 出口 IP 跨区漂移（账号风控最坏的情况）。
;   只有 🔐 AI 稳定 / 🏠 自建 VPS 保留 gstatic：那里要确认的正是「能不能出到 Google 系」。
;   注：provider（订阅）级健康检查 ini 管不到，由 router/openclash_custom_overwrite.sh 在路由器上关闭。
; AI 批准出口链：VPS 优先，故障时依次 SG → JP → US；地区内仍专线优先。
; 全部失败不直连；节点名称和连通探针本身不证明真实地区或服务解锁。
custom_proxy_group=🔐 AI 稳定`fallback`[]🏠 自建 VPS`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`https://www.gstatic.com/generate_204`600,10
; 固定出口：五大区依次兜底 → 冷门自动；链尾加 🧭 手动选择 / DIRECT 两个选项
;   （全地区挂掉时先落到手动选中的节点，再不行直连；fallback 组在面板里也能直接钉选这两项）
custom_proxy_group=🌐 Default`fallback`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门自动`[]🧭 手动选择`[]DIRECT`https://cp.cloudflare.com/generate_204`600,10

; ==========================================================
; 5) 节点池
; ==========================================================
; 自建 VPS 精确白名单：当前 CF-WS-443；多节点格式 ^(?:CF-WS-443|CF-WS-2)$。
; 路由器只从顶层 proxies 取批准 VPS，拒绝 provider 同名注入；CF-WS 前缀仍从冷门池排除。
; COMPATIBLE 实际为直连；本组缺失时 REJECT，外层 AI 稳定可继续尝试批准地区。
custom_proxy_group=🏠 自建 VPS`fallback`^CF-WS-443$`https://www.gstatic.com/generate_204`600,10
; 全节点手动（自建 VPS 也在这里选）
custom_proxy_group=🧭 手动选择`select`.*
; 地区自动：只测速 7 个地区组，不再直接测速全部节点；容差 300ms + 600s 间隔
; 每个地区内部由 fallback 保持出口稳定，只有地区间明显更快才切换（不含自建 VPS / 冷门池）
custom_proxy_group=♻️ 自动选择`url-test`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`https://cp.cloudflare.com/generate_204`600,10,300

; 地区「稳定组」：fallback，挂了才切。每个地区 3 个组：
;   「🇭🇰 HK」     = fallback[专线, 全部]，应用组引用的就是它：专线有可用节点就用专线，专线全挂才落到全部节点
;   「🇭🇰 HK 专线」= 该地区 IEPL/IPLC/专线/Premium 节点；「🇭🇰 HK 全部」= 该地区全部节点
;   为什么拆成嵌套组：OpenClash 默认转换后端（SubConverter-Extended）遇到订阅链接会改成 proxy-provider，
;   每个组只保留「第一段正则」作为 filter，且会把 proxies 里的成员排到订阅节点前面 → 一个组只能写一段正则、不能再放 REJECT 占位。
;   空组：必须由路由器覆写设置 empty-fallback: REJECT，不能依赖默认的 COMPATIBLE（直连）。
;   同地区同线路按订阅顺序排列 → 最可靠的机场订阅放第一行。
