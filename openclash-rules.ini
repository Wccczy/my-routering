custom_proxy_group=🤖 ChatGPT`select`[]🧭 手动选择`[]🇺🇸 US`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🧭 手动选择`[]🇺🇸 US`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default
