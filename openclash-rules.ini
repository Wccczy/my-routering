[custom]
; ==========================================================
; 方案 C：地区组改 fallback（专线优先、挂了才切），账号类应用默认用地区稳定组，
;        其余默认自动选择；AI 走 🔐 AI 稳定 并保留手动（自建 VPS）。
; 多订阅：OpenClash 订阅转换里一行一个地址，会合并成一个配置；
;        同地区同线路的节点按订阅顺序排列 → 最稳定的机场放第一行。
; 不要再用 load-balance：同一网站多出口 IP 会触发风控，池内节点挂掉会导致整批站点断连。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
; 注意：不要加“节点”这类词，很多机场节点名本身就叫“香港节点01”，会被整批剔除
; 注意：外部配置里只认 exclude_remarks / include_remarks；写成 exclude= 会被 subconverter 静默忽略
exclude_remarks=(?i)流量|套餐|到期|过期|有效期|剩余|重置|官网|网站|网址|失联|公告|通知|TG群|TG频道|Telegram群|Telegram频道|电报群|电报频道|说明|QQ群|客服|工单|订阅|域名|无法|客户端|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
;    GEOSITE/GEOIP 标签依赖当前内核和 geo 数据；如生成失败，优先检查对应标签是否存在。
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Tailscale 直连 ---
; 域名/CGNAT/IPv6 ULA：保留兜底，覆盖 MagicDNS、tailnet 内部访问
ruleset=DIRECT,[]DOMAIN-SUFFIX,tailscale.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,ts.net
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fd7a:115c:a1e0::/48,no-resolve

; --- Tailscale DERP / NAT 穿透专用旁路 ---
; 背景：Tailscale 守护进程用内置 DNS 解析器直接查 derpN.tailscale.com（不走系统 DNS），
; 到达 clash 时已是裸 IP，DOMAIN-SUFFIX 规则不命中。Tailscale 又对 NAT 端口映射极度敏感，
; 一旦 UDP 走代理就会(a)永远无法 P2P 直连；(b)DERP netcheck 测量全被代理延迟拉平，
; 误选远端 DERP；(c)VNC/SSH 必走 DERP 中继，jitter 巨大。
; 下面 7 条按"端口 → IP 段"双保险，覆盖 netcheck/STUN/WireGuard/DERP HTTPS。
; DERP/STUN 探测（netcheck）
ruleset=DIRECT,[]DST-PORT,3478
; Tailscale WireGuard 默认端口（对端入站）
ruleset=DIRECT,[]DST-PORT,41641
; Tailscale WireGuard 默认端口（本地出站）
ruleset=DIRECT,[]SRC-PORT,41641
; HE 段：含 derp10/HKG（香港）
ruleset=DIRECT,[]IP-CIDR,192.73.240.0/24,no-resolve
; Tailscale 自有段（多区 DERP）
ruleset=DIRECT,[]IP-CIDR,205.147.104.0/22,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,208.83.234.0/24,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,199.38.181.0/24,no-resolve
; --- 自建 DERP 节点（广州阿里云）直连 ---
ruleset=DIRECT,[]DOMAIN-SUFFIX,wccczy.online
ruleset=DIRECT,[]IP-CIDR,8.148.145.218/32,no-resolve
; 备注：DERP 节点 IP 偶尔会扩，权威列表见 https://login.tailscale.com/derpmap/default
; 如发现新 IP 段被代理（tailscale ping 仍走错 DERP），把该段补到上面 IP-CIDR 列表。

; --- 广告拦截 ---
; 放在国内直连之前，国内 App 的广告/统计域名也会被拦。个别 App 或网页异常时，把「🛑 广告拦截」切到 DIRECT 排查。
; 必须放在 Adobe/私网/Tailscale 之后，避免误伤这几类。
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 核心应用 ---
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve

ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaiusercontent.com

; 下面的手写 AI 规则是 GEOSITE,category-ai-!cn 的保底：geo 数据缺失或过旧时依然生效
; --- Claude / Anthropic ---
ruleset=🧠 AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=🧠 AI,[]DOMAIN-SUFFIX,claude.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,claudeusercontent.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,anthropic.com

; --- Gemini / Google AI ---
; 这些是 google.com 的子域，必须写在 GEOSITE,google 之前，否则会走 🔎 Google（HK 节点用不了 Gemini）
ruleset=🧠 AI,[]DOMAIN,gemini.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,gemini.google
ruleset=🧠 AI,[]DOMAIN,aistudio.google.com
ruleset=🧠 AI,[]DOMAIN,bard.google.com
ruleset=🧠 AI,[]DOMAIN,makersuite.google.com
ruleset=🧠 AI,[]DOMAIN,notebooklm.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,notebooklm.google
ruleset=🧠 AI,[]DOMAIN,alkalimakersuite-pa.clients6.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,ai.google.dev

; --- Copilot / Microsoft / GitHub Copilot ---
ruleset=🧠 AI,[]DOMAIN,copilot.microsoft.com
; Copilot 的对话后端；不写这条会命中 GEOSITE,microsoft 走 🪟 Microsoft（默认直连）
ruleset=🧠 AI,[]DOMAIN,sydney.bing.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,githubcopilot.com
ruleset=🧠 AI,[]DOMAIN,copilot-proxy.githubusercontent.com

ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

; --- 海外主流应用补充 ---
; 注：MetaCubeX GeoIP 没有 adobe/tiktok/github/microsoft 标签，写了也匹配不到（geodata 模式下还可能报错），故只用 GEOSITE
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter
ruleset=🐦 X,[]GEOIP,twitter,no-resolve

; --- Cathay Pacific（必须在 MATCH 之前，否则永不生效）---
ruleset=✈️ Cathay Pacific,[]DOMAIN-KEYWORD,cathaypacific

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
; Meta 系（Facebook/Instagram/WhatsApp）共用 IP 段，裸 IP 连接归社交媒体
ruleset=💬 社交媒体,[]GEOIP,facebook,no-resolve

; --- Google / Microsoft（新增） ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
; Cloudflare IP 作为 CDN 基础设施容易覆盖无关网站，默认不启用。
; ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve

ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- GFW 兜底 ---
ruleset=🚀 代理兜底,[]GEOSITE,gfw

; --- 最终兜底（必须是最后一条，之后的规则永不生效）---
ruleset=🐟 漏网之鱼,[]MATCH


; ==========================================================
; 2) 应用分流策略组
;    默认值 = 列表第一项，其余全部可在面板手动切换
;    · 在乎出口 IP（账号风控）：默认用地区「稳定组」(fallback)，节点挂了才切，IP 不随延迟抖动乱跳
;    · 不在乎出口 IP：默认 ♻️ 自动选择（url-test，大容差）
;    · 直连优先的（测速/Steam/Microsoft）保持 DIRECT 在首位
; ==========================================================

; --- 在乎 IP：AI ---
; 默认 🔐 AI 稳定（自建 VPS → US → SG → JP → TW 自动兜底）；想锁死某个节点时切 🧭 手动选择
custom_proxy_group=🤖 ChatGPT`select`[]🔐 AI 稳定`[]🧭 手动选择`[]🏠 自建 VPS`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇭🇰 HK`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🔐 AI 稳定`[]🧭 手动选择`[]🏠 自建 VPS`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇭🇰 HK`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default

; --- 在乎 IP：账号类 ---
custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
; TikTok 已退出香港，HK 节点无法使用，默认 JP
custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]🇭🇰 HK`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; --- 不在乎 IP：默认自动选择 ---
custom_proxy_group=📨 Telegram`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=📞 即时通讯`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=💬 社交媒体`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
; Netflix 解锁看具体节点（订阅里标了 NF/奈飞 的），自动选择不保证解锁，看片时手动选
custom_proxy_group=🎥 Netflix`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=☁️ cloudflare`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=✈️ Cathay Pacific`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT`[]🌐 Default
; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT`[]REJECT`[]🌐 Default

; --- 直连优先 ---
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门自动`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
; 广告拦截：默认 REJECT；遇到误杀切 DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; ==========================================================
; 3) 兜底出口
; ==========================================================
; GFW 列表：不在乎 IP，默认自动选择
custom_proxy_group=🚀 代理兜底`select`[]♻️ 自动选择`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
; 漏网之鱼：默认自动选择；想要固定出口时切 🌐 Default
custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动选择`[]🌐 Default`[]DIRECT`[]🧊 冷门节点`[]🧭 手动选择`[]🚀 代理兜底

; ==========================================================
; 4) 自动兜底链（fallback：按顺序用第一个可用的，前面的恢复后自动切回）
;    fallback 组在面板里也能手动点选某一项，手动选中后只要它可用就一直用它
; ==========================================================
; AI 专用：自建 VPS 优先，VPS 挂了自动落到机场 US 节点，恢复后自动切回；刻意不含 HK（OpenAI/Claude/Gemini 均不服务香港），也不含 DIRECT，全挂就断网而不是裸连
custom_proxy_group=🔐 AI 稳定`fallback`[]🏠 自建 VPS`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`http://www.gstatic.com/generate_204`120,5
; 固定出口：五大区依次兜底，最后用冷门节点，冷门节点也在这里被利用起来
custom_proxy_group=🌐 Default`fallback`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇺🇸 US`[]🧊 冷门自动`http://www.gstatic.com/generate_204`120,5

; ==========================================================
; 5) 节点池
; ==========================================================
; 自建 VPS（233boy 脚本默认命名 233boy-reality-…）：只给 AI 用，已从 ♻️ 自动选择 / 🧊 冷门 中排除，避免 IP 被其他流量用到。
;   换了节点名前缀时，改这里和所有 (?!.*233boy) 即可（qx_gen.py 会校验两边一致）。
;   末尾 []REJECT：订阅里没有 VPS 时组内不会变成 DIRECT，🔐 AI 稳定 会直接跳到 US。
custom_proxy_group=🏠 自建 VPS`fallback`(?i)^233boy`[]REJECT`http://www.gstatic.com/generate_204`60,5
; 全节点手动（自建 VPS 也在这里选）
custom_proxy_group=🧭 手动选择`select`.*
; 全节点自动（排除自建 VPS）：容差 150ms + 300s 间隔，只有明显更快才切，避免 IP 频繁跳动
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*233boy).*`http://www.gstatic.com/generate_204`300,5,150

; 地区「稳定组」：fallback，挂了才切。
;   第一段正则 = 该地区的专线节点（IEPL/IPLC/专线/Premium）排在最前；第二段 = 该地区全部节点。
;   subconverter 按正则顺序拼接并去重，所以专线永远优先。多订阅时同类节点按订阅顺序排列 → 最可靠的机场订阅放第一行。
;   末尾 []REJECT：该地区一个节点都没有时，防止 subconverter 自动塞 DIRECT 导致裸连；REJECT 测不通，外层 fallback 会跳过它。
custom_proxy_group=🇭🇰 HK`fallback`(?i)^(?=.*(IEPL|IPLC|专线|Premium))(?=.*(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|hongkong))`(?i)(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|hongkong)`[]REJECT`http://www.gstatic.com/generate_204`120,5
custom_proxy_group=🇹🇼 TW`fallback`(?i)^(?=.*(IEPL|IPLC|专线|Premium))(?=.*(🇹🇼|台湾|\bTW\b|\bTWN\b|taiwan|taipei|hinet))`(?i)(🇹🇼|台湾|\bTW\b|\bTWN\b|taiwan|taipei|hinet)`[]REJECT`http://www.gstatic.com/generate_204`120,5
custom_proxy_group=🇯🇵 JP`fallback`(?i)^(?=.*(IEPL|IPLC|专线|Premium))(?=.*(🇯🇵|日本|\bJP\b|\bJPN\b|\bTYO\b|\bNRT\b|\bHND\b|\bKIX\b|tokyo|osaka))`(?i)(🇯🇵|日本|\bJP\b|\bJPN\b|\bTYO\b|\bNRT\b|\bHND\b|\bKIX\b|tokyo|osaka)`[]REJECT`http://www.gstatic.com/generate_204`120,5
custom_proxy_group=🇸🇬 SG`fallback`(?i)^(?=.*(IEPL|IPLC|专线|Premium))(?=.*(🇸🇬|新加坡|\bSG\b|\bSGP\b|\bSIN\b|singapore))`(?i)(🇸🇬|新加坡|\bSG\b|\bSGP\b|\bSIN\b|singapore)`[]REJECT`http://www.gstatic.com/generate_204`120,5
