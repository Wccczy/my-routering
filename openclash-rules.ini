custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 国家节点测速组
; ==========================================================
; 全节点（允许任何节点显示）
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|hongkong)`http://www.gstatic.com/generate_204`120,5,20
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\bTW\b|\bTWN\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`120,5,20
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\bJP\b|\bJPN\b|\bTYO\b|\bNRT\b|\bHND\b|\bKIX\b|tokyo|osaka)`http://www.gstatic.com/generate_204`120,5,20
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\bSG\b|\bSGP\b|\bSIN\b|singapore)`http://www.gstatic.com/generate_204`120,5,20
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\bUS\b|\bUSA\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york|\bLAX\b|\bSFO\b|\bSJC\b|\bSEA\b|\bNYC\b)`http://www.gstatic.com/generate_204`120,5,20
; 冷门节点池（排除 HK/JP/TW/US/SG）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即“冷门”
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|hongkong|🇯🇵|日本|\bJP\b|\bJPN\b|\bTYO\b|\bNRT\b|\bHND\b|\bKIX\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|\bTWN\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|\bSGP\b|\bSIN\b|singapore|🇺🇸|美国|\bUS\b|\bUSA\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york|\bLAX\b|\bSFO\b|\bSJC\b|\bSEA\b|\bNYC\b)).*
