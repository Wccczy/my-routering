custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default

; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
;    同时新增：🧊 冷门节点（只收非 HK/JP/TW/US/SG 的节点）
; ==========================================================

; 代理兜底（不越权应用，只用于 Default/漏网）
custom_proxy_group=🚀 代理兜底`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT

; Default 出口（同样允许冷门节点参与）
custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🧭 手动选择`[]🚀 代理兜底


; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 国家节点测速组
; ==========================================================
; 全节点（允许任何节点显示）
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|\\bHKG\\b|hong\\s*kong|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|\\bTWN\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|\\bJPN\\b|\\bTYO\\b|\\bNRT\\b|\\bHND\\b|\\bKIX\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|\\bSGP\\b|\\bSIN\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|\\bUSA\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york|\\bLAX\\b|\\bSFO\\b|\\bSJC\\b|\\bSEA\\b|\\bNYC\\b)`http://www.gstatic.com/generate_204`300,,50
; 冷门节点池（排除 HK/JP/TW/US/SG）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即“冷门”
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|\\bHKG\\b|hong\\s*kong|hongkong|🇯🇵|日本|\\bJP\\b|\\bJPN\\b|\\bTYO\\b|\\bNRT\\b|\\bHND\\b|\\bKIX\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|\\bTWN\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|\\bSGP\\b|\\bSIN\\b|singapore|🇺🇸|美国|\\bUS\\b|\\bUSA\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york|\\bLAX\\b|\\bSFO\\b|\\bSJC\\b|\\bSEA\\b|\\bNYC\\b)).*
