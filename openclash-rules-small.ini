[custom]
; ==========================================================
; 🪶 低内存版分流模板 —— 专供 480MB 内存路由器(Cudy TR3000 v1)
; 大内存环境请用 openclash-rules.ini(全量版,QX 生成也以它为源头)
;
; 与全量版的差异(砍的都是内存大户,详见各段注释):
;   - 删 GEOSITE,category-ads-all(188,023 条,全 dat 最大,启动 OOM 的直接死因),路由器层广告拦截取消
;   - 删全部特殊 GEOIP(telegram/facebook/twitter/netflix/google):任何非国家码 GEOIP 都会迫使内核
;     解码整个 16.6MB 的 GeoIP.dat(1,061,029 条 CIDR)。Telegram DC 段改手写静态 CIDR(官方网段,极稳定)
;   - 删 GEOSITE,gfw(4,410 条):与「漏网之鱼→自动选择」兜底默认行为完全重复
;   - 删 Netflix / TikTok 组(YouTube 保留)
;   精简后 GEOSITE 加载 311k → 118k 条(↓62%),GeoIP.dat 完全不再加载;
;   内核 RSS 峰值 353MB+(被 OOM 杀)→ 预计 ~150-220MB。
;
; 上线:git push 后把路由器 OpenClash 订阅转换的自定义模板 URL 指到本文件 raw 地址。
; 验证:重启后盯 /proc/$(pidof clash)/status 的 VmRSS 与 dmesg 无 oom-kill,稳定 5 分钟算通过。
;
; ⚠️ ruleset 总数不能超过 64:转换后端 max_allowed_rulesets 默认 64,超过会整份忽略本模板、
;    退回默认模板(静默失败,只表现为"规则没生效")。当前 63 条,只剩 1 条余量,
;    加规则前先数一遍;要加规则优先考虑删一条等价规则。
;
; 其余设计(节点清洗、策略组、专线嵌套、地区正则同步约束)与全量版完全一致,见 openclash-rules.ini 头注。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗:剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
; 注意:不要加"节点"这类词,很多机场节点名本身就叫"香港节点01",会被整批剔除
; 注意:外部配置里只认 exclude_remarks / include_remarks;写成 exclude= 会被 subconverter 静默忽略
exclude_remarks=(?i)流量|套餐|到期|过期|有效期|剩余|重置|官网|网站|网址|失联|公告|通知|TG群|TG频道|Telegram群|Telegram频道|电报群|电报频道|说明|QQ群|客服|工单|订阅|域名|无法|客户端|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则(自上而下优先级)
;    GEOSITE/GEOIP 标签依赖当前内核和 geo 数据;如生成失败,优先检查对应标签是否存在。
;    ⚠️ 本模板依赖的 GEOSITE 分类合计 ~118k 条,其中 GEOSITE,cn 一家 111k——这是保留的全部理由:
;       其余分类均 ≤2k 条。不要往回加 category-ads-all / gfw 这类大分类。
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe
; --- 私网直连 ---
; 只保留域名形式(*.local 等)。RFC1918 网段不用规则:OpenClash 防火墙默认不把内网目标流量送进 clash
; (openclash_custom_localnetwork_ipv4.list 默认含 10/8、172.16/12、192.168/16);
; CGNAT 100.64/10 不属于 RFC1918,防火墙不放行,由下方 Tailscale 段显式直连。
; 全量版的 GEOIP,private 在此删除——它是触发 GeoIP.dat 加载的规则之一,三保险不值得 16.6MB。
ruleset=DIRECT,[]GEOSITE,private

; --- Tailscale 直连 ---
; 域名/CGNAT/IPv6 ULA:保留兜底,覆盖 MagicDNS、tailnet 内部访问
ruleset=DIRECT,[]DOMAIN-SUFFIX,tailscale.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,ts.net
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fd7a:115c:a1e0::/48,no-resolve

; --- Tailscale DERP / NAT 穿透专用旁路 ---
; 背景:Tailscale 守护进程用内置 DNS 解析器直接查 derpN.tailscale.com(不走系统 DNS),
; 到达 clash 时已是裸 IP,DOMAIN-SUFFIX 规则不命中。Tailscale 又对 NAT 端口映射极度敏感,
; 一旦 UDP 走代理就会(a)永远无法 P2P 直连;(b)DERP netcheck 测量全被代理延迟拉平,
; 误选远端 DERP;(c)VNC/SSH 必走 DERP 中继,jitter 巨大。
; 下面按"端口 → IP 段"双保险,覆盖 netcheck/STUN/WireGuard/DERP HTTPS。
; DERP/STUN 探测(netcheck)
ruleset=DIRECT,[]DST-PORT,3478
; Tailscale WireGuard 默认端口(对端入站)
ruleset=DIRECT,[]DST-PORT,41641
; Tailscale WireGuard 默认端口(本地出站)
ruleset=DIRECT,[]SRC-PORT,41641
; HE 段:含 derp10/HKG(香港)
ruleset=DIRECT,[]IP-CIDR,192.73.240.0/24,no-resolve
; Tailscale 自有段(多区 DERP)
ruleset=DIRECT,[]IP-CIDR,205.147.104.0/22,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,208.83.234.0/24,no-resolve
; Tailscale 自有段
ruleset=DIRECT,[]IP-CIDR,199.38.181.0/24,no-resolve
; --- 自建 DERP 节点(广州阿里云)直连 ---
ruleset=DIRECT,[]DOMAIN-SUFFIX,wccczy.online
ruleset=DIRECT,[]IP-CIDR,8.148.145.218/32,no-resolve
; 备注:DERP 节点 IP 偶尔会扩,权威列表见 https://login.tailscale.com/derpmap/default
; 如发现新 IP 段被代理(tailscale ping 仍走错 DERP),把该段补到上面 IP-CIDR 列表。

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 国内直连 ---
; GEOIP,cn 走 Country.mmdb(266KB,很便宜),不触发 GeoIP.dat,保留
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- Telegram ---
; 域名 + 手写静态 DC 网段(取自 MetaCubeX geoip_telegram.list,官方 DC,极稳定,同 DERP 的做法)。
; 替代 GEOIP,telegram:那是触发 GeoIP.dat(16.6MB / 106 万 CIDR)整包解码的规则之一,
; 而它只贡献 12 个网段。裸 IP 语音通话精确命中 → 📨 Telegram 组(和全量版行为一致)。
; 91.108.8.0/21 与 91.108.16.0/21 相邻,合并为 /20(恰无缝覆盖,为 64 条限额省 1 条)。
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]IP-CIDR,91.105.192.0/23,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,91.108.4.0/22,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,91.108.8.0/20,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,91.108.56.0/22,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,95.161.64.0/20,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,149.154.160.0/20,no-resolve
ruleset=📨 Telegram,[]IP-CIDR,185.76.151.0/24,no-resolve
ruleset=📨 Telegram,[]IP-CIDR6,2001:67c:4e8::/48,no-resolve
ruleset=📨 Telegram,[]IP-CIDR6,2001:b28:f23c::/47,no-resolve
ruleset=📨 Telegram,[]IP-CIDR6,2001:b28:f23f::/48,no-resolve
ruleset=📨 Telegram,[]IP-CIDR6,2a0a:f280::/32,no-resolve

ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaiusercontent.com

; 下面的手写 AI 规则是 GEOSITE,category-ai-!cn 的保底(只保留最核心的)。
;    claude.com / notebooklm / bard / makersuite 等已由 GEOSITE,category-ai-!cn 覆盖(在 GEOSITE,google 之前)。
; --- Claude / Anthropic ---
ruleset=🧠 AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=🧠 AI,[]DOMAIN-SUFFIX,anthropic.com

; --- Gemini / Google AI ---
; 这些是 google.com 的子域,必须写在 GEOSITE,google 之前,否则会走 🔎 Google(HK 节点用不了 Gemini)
ruleset=🧠 AI,[]DOMAIN,gemini.google.com
ruleset=🧠 AI,[]DOMAIN,aistudio.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,ai.google.dev

; --- Copilot / Microsoft / GitHub Copilot ---
ruleset=🧠 AI,[]DOMAIN,copilot.microsoft.com
; Copilot 的对话后端;不写这条会命中 GEOSITE,microsoft 走 🪟 Microsoft(默认直连)
ruleset=🧠 AI,[]DOMAIN,sydney.bing.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,githubcopilot.com
ruleset=🧠 AI,[]DOMAIN,copilot-proxy.githubusercontent.com

ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube

; --- 海外主流应用补充 ---
; Netflix / TikTok 已删(低内存版不用流媒体);裸 IP 归漏网之鱼,行为见头注
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- Cathay Pacific(必须在 MATCH 之前,否则永不生效)---
ruleset=✈️ Cathay Pacific,[]DOMAIN-KEYWORD,cathaypacific

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; ==========================================================
; --- 社交 / 通讯 ---
; ==========================================================
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
; 全量版此处有 GEOIP,facebook(Meta 系裸 IP 归社交媒体):已删,理由同上,裸 IP 落漏网之鱼→代理

; --- Google / Microsoft ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
; Cloudflare IP 作为 CDN 基础设施容易覆盖无关网站,默认不启用(全量版同)。

ruleset=🔎 Google,[]GEOSITE,google
; 全量版此处有 GEOIP,google(8000+ 段):已删,是 GeoIP.dat 触发器之一

ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- 最终兜底(必须是最后一条,之后的规则永不生效)---
; 全量版在 MATCH 前还有 GEOSITE,gfw:已删——它和本条默认都走自动选择代理,行为完全重复,
; 只有把漏网之鱼切 DIRECT(白名单模式)时才有意义,届时从全量版复制回来。
ruleset=🐟 漏网之鱼,[]MATCH


; ==========================================================
; 2) 应用分流策略组
;    与全量版一致,仅删 🛑 广告拦截 / 🎥 Netflix / 🎵 TikTok 三组(对应规则已砍)。
;    默认值 = 列表第一项,其余全部可在面板手动切换
;    · 在乎出口 IP(账号风控):默认用地区「稳定组」(fallback),节点挂了才切,IP 不随延迟抖动乱跳
;    · 不在乎出口 IP:默认 ♻️ 自动选择(url-test,大容差)
;    · 直连优先的(测速/Steam/Microsoft)保持 DIRECT 在首位
; ==========================================================

; --- 在乎 IP:AI ---
; 默认 🔐 AI 稳定(自建 VPS → US → SG → JP → TW 自动兜底);想锁死某个节点时切 🧭 手动选择
custom_proxy_group=🤖 ChatGPT`select`[]🔐 AI 稳定`[]🧭 手动选择`[]🏠 自建 VPS`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇭🇰 HK`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🔐 AI 稳定`[]🧭 手动选择`[]🏠 自建 VPS`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇭🇰 HK`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]♻️ 自动选择`[]🌐 Default

; --- 在乎 IP:账号类 ---
custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; --- 不在乎 IP:默认自动选择 ---
custom_proxy_group=📨 Telegram`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
