; 地区「稳定组」:fallback,挂了才切。每个地区 3 个组:
;   「🇭🇰 HK」     = fallback[专线, 全部],应用组引用的就是它:专线有可用节点就用专线,专线全挂才落到全部节点
;   「🇭🇰 HK 专线」= 该地区 IEPL/IPLC/专线/Premium 节点;「🇭🇰 HK 全部」= 该地区全部节点
;   为什么拆成嵌套组:OpenClash 默认转换后端(SubConverter-Extended)遇到订阅链接会改成 proxy-provider,
;   每个组只保留「第一段正则」作为 filter,且会把 proxies 里的成员排到订阅节点前面 → 一个组只能写一段正则、不能再放 REJECT 占位。
;   空组:provider 模式下为空时 mihomo 自动填 COMPATIBLE(不可用、不会直连),外层 fallback 会跳过。
;   同地区同线路按订阅顺序排列 → 最可靠的机场订阅放第一行。
;   ⚠️ 这些正则必须与 openclash-rules.ini(全量版)保持一致:改任一边都同步另一边。
