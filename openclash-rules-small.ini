custom_proxy_group=💬 社交媒体`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=☁️ cloudflare`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=✈️ Cathay Pacific`select`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US`[]🇰🇷 KR`[]🇵🇭 PH`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT`[]🌐 Default
